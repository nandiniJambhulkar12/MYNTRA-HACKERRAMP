<div class="actor-box">
    <div class="card">
        <p-carousel [value]="filmsList" [numVisible]="1" [circular]="true" autoplayInterval="3000">
            <ng-template let-actor pTemplate="item">
                <div class="border-1 surface-border border-round m-2 p-3">
                    <div class="mb-3">
                        <div class="relative mx-auto">
                            <img src="/assets/images/{{actor.path}}" alt="image" class="w-full border-round" />
                        </div>
                    </div>
                </div>
            </ng-template>
        </p-carousel>
    </div>
</div>
